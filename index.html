<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>มีอะไรจะบอก</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pink-a:#ffe4e9;
    --pink-b:#ffd0d9;
    --pink-c:#fff5f2;
    --gold:#a97327;
    --gold-dark:#8a5c1c;
    --white:#ffffff;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    height:100%;
    overflow:hidden;
    font-family:'Mitr', sans-serif;
  }
  body{
    background: radial-gradient(120% 120% at 50% 0%, var(--pink-c) 0%, var(--pink-a) 45%, var(--pink-b) 100%);
    position:relative;
  }
  .screen{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:32px;
    opacity:0;
    pointer-events:none;
    transform:translateY(12px);
    transition:opacity .45s ease, transform .45s ease;
  }
  .screen.active{
    opacity:1;
    pointer-events:auto;
    transform:translateY(0);
  }
  .cat-frame{
    width:150px;
    height:150px;
    background:var(--white);
    border-radius:18px;
    box-shadow:0 12px 30px rgba(169,115,39,0.18);
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:36px;
    animation:float 3.2s ease-in-out infinite;
  }
  .cat-frame img{
    width:78%;
    height:78%;
    object-fit:contain;
  }
  @keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-8px);}
  }
  h1{
    color:var(--gold);
    font-weight:700;
    font-size:clamp(28px, 5vw, 46px);
    line-height:1.35;
    margin:0 0 44px 0;
    max-width:640px;
  }
  .btn{
    background:rgba(255,255,255,0.55);
    border:1px solid rgba(255,255,255,0.8);
    backdrop-filter: blur(6px);
    color:var(--gold);
    font-family:'Mitr', sans-serif;
    font-weight:600;
    font-size:clamp(18px, 3vw, 26px);
    padding:20px 56px;
    border-radius:999px;
    cursor:pointer;
    box-shadow:0 10px 24px rgba(169,115,39,0.15), inset 0 0 20px rgba(255,255,255,0.6);
    transition:transform .18s ease, box-shadow .18s ease;
    position:relative;
  }
  .btn:hover{
    box-shadow:0 14px 30px rgba(169,115,39,0.22), inset 0 0 20px rgba(255,255,255,0.7);
  }
  .btn:active{
    transform:scale(0.97);
  }
  #dodgeStage{
    position:relative;
    width:100%;
    max-width:900px;
    height:min(50vh, 380px);
  }
  #dodgeStage h1{
    position:absolute;
    top:0;
    left:50%;
    transform:translateX(-50%);
    width:90%;
    margin:0;
  }
  #dodgeBtn{
    position:absolute;
    top:60%;
    left:50%;
    transform:translate(-50%,-50%);
    margin:0;
  }
  .hint{
    margin-top:18px;
    color:var(--gold-dark);
    opacity:0.55;
    font-size:14px;
    letter-spacing:0.5px;
    min-height:18px;
  }
  #final h1{
    max-width:720px;
  }
  #final .line1{
    font-size:clamp(30px, 5.5vw, 52px);
    display:block;
    margin-bottom:8px;
  }
  #final .line2{
    display:block;
    font-size:clamp(22px, 4vw, 34px);
    margin-bottom:24px;
  }
  #final .line3{
    display:block;
    font-size:clamp(26px, 4.6vw, 40px);
  }

</style>
</head>
<body>

  <!-- Screen 1 -->
  <section class="screen active" id="screen1">
    <div class="cat-frame"><img src="cat.png" alt="cat"></div>
    <h1>ผมมีอะไรจะบอก<br>อยากรู้ป่ะะะ</h1>
    <button class="btn" id="toScreen2">กดตรงนี้เร็วว</button>
  </section>

  <!-- Screen 2 -->
  <section class="screen" id="screen2">
    <div class="cat-frame"><img src="cat.png" alt="cat"></div>
    <div id="dodgeStage">
      <h1 id="dodgeTitle">อยากรู้จริงป่ะ</h1>
      <button class="btn" id="dodgeBtn">เอาจริงเดด</button>
    </div>
    <div class="hint" id="hintText"></div>
  </section>

  <!-- Screen 3 -->
  <section class="screen" id="final">
    <h1>
      <span class="line1">คือผมชอบพี่</span>
      <span class="line2">ผมไม่รู้พี่คิดยังไงกับผม<br>เพราะงั้น</span>
      <span class="line3">ไปดีกว่าาาาาาาา</span>
    </h1>
  </section>

<script>
  const s1 = document.getElementById('screen1');
  const s2 = document.getElementById('screen2');
  const s3 = document.getElementById('final');
  const toScreen2 = document.getElementById('toScreen2');
  const dodgeBtn = document.getElementById('dodgeBtn');
  const dodgeStage = document.getElementById('dodgeStage');
  const hintText = document.getElementById('hintText');

  function showScreen(el){
    [s1, s2, s3].forEach(s => s.classList.remove('active'));
    el.classList.add('active');
  }

  toScreen2.addEventListener('click', () => {
    dodgeClicks = 0;
    positionDodgeBtn(true);
    hintText.textContent = '';
    showScreen(s2);
  });

  let dodgeClicks = 0;
  const hints = ['พี่ก็กดให้โดนสิ', 'อีกรอบๆๆ', 'รอบท้ายแล้ว'];

  function positionDodgeBtn(center){
    const stageRect = dodgeStage.getBoundingClientRect();
    const btnRect = dodgeBtn.getBoundingClientRect();
    const bw = btnRect.width || 220;
    const bh = btnRect.height || 70;

    // usable area within the stage, avoiding the title area near the top and the edges
    const minTop = stageRect.height * 0.4;
    const maxTop = stageRect.height - bh - 10;
    const minLeft = 10;
    const maxLeft = stageRect.width - bw - 10;

    let top, left;
    if(center){
      top = stageRect.height * 0.6 - bh/2;
      left = stageRect.width * 0.5 - bw/2;
    } else {
      top = minTop + Math.random() * Math.max(1, (maxTop - minTop));
      left = minLeft + Math.random() * Math.max(1, (maxLeft - minLeft));
    }

    dodgeBtn.style.top = top + 'px';
    dodgeBtn.style.left = left + 'px';
    dodgeBtn.style.transform = 'none';
  }

  // dodge on hover too, for desktop mouse users, so it feels alive before the click even lands
  dodgeBtn.addEventListener('mouseenter', () => {
    if(dodgeClicks < 2){
      positionDodgeBtn(false);
    }
  });

  dodgeBtn.addEventListener('click', (e) => {
    dodgeClicks++;
    if(dodgeClicks < 3){
      hintText.textContent = hints[dodgeClicks - 1] || '';
      positionDodgeBtn(false);
    } else {
      showScreen(s3);
    }
  });

  window.addEventListener('resize', () => {
    if(s2.classList.contains('active') && dodgeClicks > 0 && dodgeClicks < 3){
      positionDodgeBtn(false);
    }
  });
</script>
</body>
</html>
