<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>คลิกดูสิ</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: "Segoe UI", "TH Sarabun New", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    cursor: pointer;
    user-select: none;
    overflow: hidden;
  }

  #message {
    font-size: 3rem;
    font-weight: bold;
    opacity: 0;
    transform: scale(0.8);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }

  #message.show {
    opacity: 1;
    transform: scale(1);
  }

  #hint {
    position: absolute;
    bottom: 40px;
    font-size: 0.9rem;
    color: #555;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }
</style>
</head>
<body onclick="reveal()">
  <div id="message"></div>
  <div id="hint">คลิกที่ไหนก็ได้</div>

  <script>
    function reveal() {
      const msg = document.getElementById('message');
      const hint = document.getElementById('hint');
      msg.textContent = "ขอคอมหน่อย 🙏";
      msg.classList.add('show');
      hint.style.display = 'none';
    }
  </script>
</body>
</html>
